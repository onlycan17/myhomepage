<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc">
  <title id="title">번호표와 출입증으로 이해하는 로그인</title>
  <desc id="desc">세션은 브라우저가 보낸 번호표를 서버의 로그인 기록과 대조한다. 서명된 JWT는 브라우저가 보낸 토큰의 서명과 사용 조건을 서버에서 확인한다. 두 방식 모두 요청별 권한 확인이 필요하다.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs>
  <rect width="720" height="850" rx="28" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="360" y="65" font-size="29" font-weight="700">로그인을 확인하는 두 가지 흐름</text>
    <rect x="40" y="105" width="640" height="280" rx="20" fill="#e6f4ef"/>
    <text x="360" y="155" font-size="28" font-weight="700">세션 · 번호표와 명부</text>
    <rect x="70" y="185" width="230" height="120" rx="14" fill="white" stroke="#0f766e"/>
    <rect x="410" y="185" width="230" height="120" rx="14" fill="white" stroke="#0f766e"/>
    <text x="185" y="229" font-size="25">브라우저</text><text x="185" y="273" font-size="23">세션 ID 보관</text>
    <path d="M315 245 H390" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/>
    <text x="525" y="229" font-size="25">서버</text><text x="525" y="273" font-size="23">로그인 기록 조회</text>
    <text x="360" y="351" font-size="22" fill="#115e59">서버 기록을 무효화하면 이후 요청 차단</text>
    <rect x="40" y="420" width="640" height="280" rx="20" fill="#fff0dd"/>
    <text x="360" y="470" font-size="28" font-weight="700">서명된 JWT · 검증하는 출입증</text>
    <rect x="70" y="500" width="230" height="120" rx="14" fill="white" stroke="#b45309"/>
    <rect x="410" y="500" width="230" height="120" rx="14" fill="white" stroke="#b45309"/>
    <text x="185" y="544" font-size="25">브라우저</text><text x="185" y="588" font-size="23">토큰 전달</text>
    <path d="M315 560 H390" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/>
    <text x="525" y="544" font-size="25">서버</text><text x="525" y="588" font-size="23">서명·조건 검증</text>
    <text x="360" y="666" font-size="22" fill="#92400e">즉시 취소하려면 별도 확인 구조 필요</text>
    <text x="360" y="760" font-size="24" font-weight="700">두 방식 모두 요청별 권한 확인이 필요</text>
    <text x="360" y="800" font-size="20" fill="#475569">JWT를 사용해도 서버 상태를 함께 관리할 수 있다</text>
  </g>
</svg>
