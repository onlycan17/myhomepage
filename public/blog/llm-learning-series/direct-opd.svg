<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">답안보다 변화 방향 배우기</title><desc id="desc">작은 교사의 학습 전·후: 같은 문맥에서 확률 비교. 로그 확률의 차이: 더 선호하거나 피하게 된 선택. 학생이 직접 답 생성: 자신의 생성 경로에서 신호 적용. 학생 모델 학습·평가: 기존 능력과 안정성도 확인. 교사의 최종 답을 그대로 복사하는 방식과 구분</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">답안보다 변화 방향 배우기</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">작은 교사의 학습 전·후</text><text x="320" y="198" font-size="26" fill="#334155">같은 문맥에서 확률 비교</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">로그 확률의 차이</text><text x="320" y="363" font-size="26" fill="#334155">더 선호하거나 피하게 된 선택</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">학생이 직접 답 생성</text><text x="320" y="528" font-size="26" fill="#334155">자신의 생성 경로에서 신호 적용</text>
<path d="M320 565 V587" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">학생 모델 학습·평가</text><text x="320" y="693" font-size="26" fill="#334155">기존 능력과 안정성도 확인</text>
<text x="320" y="778" font-size="24" fill="#475569">교사의 최종 답을</text>
<text x="320" y="809" font-size="24" fill="#475569">그대로 복사하는 방식과 구분</text>
</g></svg>
