<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">AI 요청서는 어디로 갈까?</title><desc id="desc">질문과 출력 조건: 무엇을 원하는지 정하기. 연결 주소와 API 키: 받는 곳과 자격을 맞추기. 지원 모델과 기능 확인: 같은 형식이어도 기능은 다름. 결과와 실패 함께 기록: 답변 · 시간 · 사용량 · 오류. 모델 엔진 ≠ 제공업체 ≠ 실행 도구</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">AI 요청서는 어디로 갈까?</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">질문과 출력 조건</text><text x="320" y="198" font-size="26" fill="#334155">무엇을 원하는지 정하기</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">연결 주소와 API 키</text><text x="320" y="363" font-size="26" fill="#334155">받는 곳과 자격을 맞추기</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">지원 모델과 기능 확인</text><text x="320" y="528" font-size="26" fill="#334155">같은 형식이어도 기능은 다름</text>
<path d="M320 565 V587" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">결과와 실패 함께 기록</text><text x="320" y="693" font-size="26" fill="#334155">답변 · 시간 · 사용량 · 오류</text>
<text x="320" y="778" font-size="24" fill="#475569">모델 엔진 ≠</text>
<text x="320" y="809" font-size="24" fill="#475569">제공업체 ≠ 실행 도구</text>
</g></svg>
