<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">AI의 작업 책상 구성하기</title><desc id="desc">지침과 현재 질문: 역할 · 목적 · 출력 조건. 대화·기억·검색·도구 결과: 이번 요청에 필요한 자료 수집. 선별하고 최신 상태 확인: 관련성 · 권한 · 버전 · 길이. 답변과 근거 평가: 같은 시험 질문으로 비교. 많이 넣기보다 필요한 정보를 정확히 제공</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">AI의 작업 책상 구성하기</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">지침과 현재 질문</text><text x="320" y="198" font-size="26" fill="#334155">역할 · 목적 · 출력 조건</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">대화·기억·검색·도구 결과</text><text x="320" y="363" font-size="26" fill="#334155">이번 요청에 필요한 자료 수집</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">선별하고 최신 상태 확인</text><text x="320" y="528" font-size="26" fill="#334155">관련성 · 권한 · 버전 · 길이</text>
