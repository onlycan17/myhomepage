<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">도구 요청부터 실제 확인까지</title><desc id="desc">모델이 도구 사용 요청: 도구 이름 · 입력 · 호출 ID. 프로그램이 검사·실행: 허용된 도구와 권한만 사용. 실행 결과를 다시 전달: 성공 · 실패 · 결과 불명 구분. 추가 요청 또는 종료: 한도 안에서 반복, 완료 확인. 모델의 완료 문장보다 실행 결과로 판단</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">도구 요청부터 실제 확인까지</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">모델이 도구 사용 요청</text><text x="320" y="198" font-size="26" fill="#334155">도구 이름 · 입력 · 호출 ID</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">프로그램이 검사·실행</text><text x="320" y="363" font-size="26" fill="#334155">허용된 도구와 권한만 사용</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">실행 결과를 다시 전달</text><text x="320" y="528" font-size="26" fill="#334155">성공 · 실패 · 결과 불명 구분</text>
<path d="M320 565 V587" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">추가 요청 또는 종료</text><text x="320" y="693" font-size="26" fill="#334155">한도 안에서 반복, 완료 확인</text>
<text x="320" y="778" font-size="24" fill="#475569">모델의 완료 문장보다</text>
<text x="320" y="809" font-size="24" fill="#475569">실행 결과로 판단</text>
</g></svg>
