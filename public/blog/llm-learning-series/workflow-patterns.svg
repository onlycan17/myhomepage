<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">업무에 맞게 호출 연결하기</title><desc id="desc">체이닝: 순서가 중요: 자료 정리 → 요약 → 작성. 라우팅: 담당 선택: 요청 분류 → 적합한 경로. 병렬: 독립 작업 분담: 각자 처리 → 결과 모으기. 에이전트: 다음 행동 선택: 관찰 → 행동 → 재확인. 네 가지 대안 비교 · 필요한 만큼만 자율성 허용</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">업무에 맞게 호출 연결하기</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">체이닝: 순서가 중요</text><text x="320" y="198" font-size="26" fill="#334155">자료 정리 → 요약 → 작성</text>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">라우팅: 담당 선택</text><text x="320" y="363" font-size="26" fill="#334155">요청 분류 → 적합한 경로</text>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">병렬: 독립 작업 분담</text><text x="320" y="528" font-size="26" fill="#334155">각자 처리 → 결과 모으기</text>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">에이전트: 다음 행동 선택</text><text x="320" y="693" font-size="26" fill="#334155">관찰 → 행동 → 재확인</text>
<text x="320" y="778" font-size="24" fill="#475569">네 가지 대안 비교</text>
<text x="320" y="809" font-size="24" fill="#475569">· 필요한 만큼만 자율성 허용</text>
</g></svg>
