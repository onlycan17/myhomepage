<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">학습과 추론은 다른 과정</title><desc id="desc">학습: 예측과 정답 비교: 오차를 줄이도록 숫자 조정. 학습된 모델 준비: 파라미터에 학습 결과 반영. 추론: 질문과 문맥 입력: 일반 요청은 파라미터 유지. 다음 토큰 생성 반복: 자연스러움과 사실은 다름. 대화 기록을 제공하는 것 ≠ 모델 재학습</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">학습과 추론은 다른 과정</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">학습: 예측과 정답 비교</text><text x="320" y="198" font-size="26" fill="#334155">오차를 줄이도록 숫자 조정</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">학습된 모델 준비</text><text x="320" y="363" font-size="26" fill="#334155">파라미터에 학습 결과 반영</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">추론: 질문과 문맥 입력</text><text x="320" y="528" font-size="26" fill="#334155">일반 요청은 파라미터 유지</text>
<path d="M320 565 V587" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">다음 토큰 생성 반복</text><text x="320" y="693" font-size="26" fill="#334155">자연스러움과 사실은 다름</text>
<text x="320" y="778" font-size="24" fill="#475569">대화 기록을 제공하는</text>
<text x="320" y="809" font-size="24" fill="#475569">것 ≠ 모델 재학습</text>
</g></svg>
