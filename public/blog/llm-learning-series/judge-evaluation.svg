<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">AI 심사도 검토가 필요하다</title><desc id="desc">공통 질문과 평가 기준: 무엇을 잘해야 하는지 정의. 답변 수집·익명화: 실패도 누락 없이 기록. 규칙 검사와 AI 심사: 형식 · 사실 · 표현을 구분. 사람의 표본 검토: 순서 편향과 근거를 대조. 높은 점수 ≠ 모든 업무에서의 정답 보장</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">AI 심사도 검토가 필요하다</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">공통 질문과 평가 기준</text><text x="320" y="198" font-size="26" fill="#334155">무엇을 잘해야 하는지 정의</text>
<path d="M320 235 V257" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">답변 수집·익명화</text><text x="320" y="363" font-size="26" fill="#334155">실패도 누락 없이 기록</text>
<path d="M320 400 V422" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">규칙 검사와 AI 심사</text><text x="320" y="528" font-size="26" fill="#334155">형식 · 사실 · 표현을 구분</text>
<path d="M320 565 V587" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">사람의 표본 검토</text><text x="320" y="693" font-size="26" fill="#334155">순서 편향과 근거를 대조</text>
<text x="320" y="778" font-size="24" fill="#475569">높은 점수 ≠</text>
<text x="320" y="809" font-size="24" fill="#475569">모든 업무에서의 정답 보장</text>
</g></svg>
