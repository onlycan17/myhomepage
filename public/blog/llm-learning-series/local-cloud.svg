<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc"><title id="title">로컬과 클라우드의 경계</title><desc id="desc">로컬: 모델 파일 준비: 다운로드에 네트워크·공간 필요. 로컬: 내 장치에서 계산: 메모리와 전력을 직접 사용. 클라우드: 외부 서버 계산: 요청과 데이터가 서버로 이동. 도구의 통신 경로 확인: 검색·외부 API도 별도로 점검. 두 실행 경로의 비교이며 순차 실행 단계가 아님</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#0f766e"/></marker></defs><rect width="640" height="850" rx="24" fill="#f5f7f4"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="320" y="64" font-size="32" font-weight="700">로컬과 클라우드의 경계</text>
<rect x="42" y="105" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="154" font-size="31" font-weight="700">로컬: 모델 파일 준비</text><text x="320" y="198" font-size="26" fill="#334155">다운로드에 네트워크·공간 필요</text>
<rect x="42" y="270" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="319" font-size="31" font-weight="700">로컬: 내 장치에서 계산</text><text x="320" y="363" font-size="26" fill="#334155">메모리와 전력을 직접 사용</text>
<rect x="42" y="435" width="556" height="125" rx="18" fill="#e2f2ec" stroke="#cbd5e1"/><text x="320" y="484" font-size="31" font-weight="700">클라우드: 외부 서버 계산</text><text x="320" y="528" font-size="26" fill="#334155">요청과 데이터가 서버로 이동</text>
<rect x="42" y="600" width="556" height="125" rx="18" fill="#fff0dd" stroke="#cbd5e1"/><text x="320" y="649" font-size="31" font-weight="700">도구의 통신 경로 확인</text><text x="320" y="693" font-size="26" fill="#334155">검색·외부 API도 별도로 점검</text>
<text x="320" y="778" font-size="24" fill="#475569">두 실행 경로의 비교이며</text>
<text x="320" y="809" font-size="24" fill="#475569">순차 실행 단계가 아님</text>
</g></svg>
