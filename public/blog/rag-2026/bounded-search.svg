<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">추가 검색에도 끝이 필요하다</title><desc id="desc">질문과 허용 범위 확인 — 찾을 내용 · 접근 권한 확인 — 시간 · 횟수 · 비용 한도 설정 / 검색하고 근거 확인 — 충분하면 → 근거와 함께 답변 — 부족하면 → 남은 한도 확인 / 한도가 남아 있다면 — 추가 검색 또는 허용된 도구 사용 — 결과를 모아 근거 다시 확인 / 한도 도달 · 진전 없음 — 반복을 멈추고 부족한 점 알리기 — 확인된 사실과 미확인 내용 구분</desc><rect width="640" height="860" rx="24" fill="#faf7ef"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" fill="#183844"><text x="32" y="60" font-size="31" font-weight="700">추가 검색에도 끝이 필요하다</text><rect x="32" y="96" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="134" font-size="29" font-weight="700">질문과 허용 범위 확인</text><text x="52" y="175" font-size="25" font-weight="400">찾을 내용 · 접근 권한 확인</text><text x="52" y="212" font-size="24" font-weight="400">시간 · 횟수 · 비용 한도 설정</text><rect x="32" y="274" width="576" height="145" rx="16" fill="#eef0f1" stroke="#a9bdb6"/><text x="52" y="312" font-size="29" font-weight="700">검색하고 근거 확인</text><text x="52" y="353" font-size="25" font-weight="400">충분하면 → 근거와 함께 답변</text><text x="52" y="390" font-size="24" font-weight="400">부족하면 → 남은 한도 확인</text><rect x="32" y="452" width="576" height="145" rx="16" fill="#fff0d2" stroke="#a9bdb6"/><text x="52" y="490" font-size="29" font-weight="700">한도가 남아 있다면</text><text x="52" y="531" font-size="25" font-weight="400">추가 검색 또는 허용된 도구 사용</text><text x="52" y="568" font-size="24" font-weight="400">결과를 모아 근거 다시 확인</text><rect x="32" y="630" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="668" font-size="29" font-weight="700">한도 도달 · 진전 없음</text><text x="52" y="709" font-size="25" font-weight="400">반복을 멈추고 부족한 점 알리기</text><text x="52" y="746" font-size="24" font-weight="400">확인된 사실과 미확인 내용 구분</text><text x="32" y="835" font-size="21" fill="#52666c">개념도 · 성능 측정값이나 고정 권장 구성이 아닙니다</text></g></svg>