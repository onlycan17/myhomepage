<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">오답은 어디에서 생겼을까?</title><desc id="desc">원문에 근거가 있나요? — 없다면 → 자료 수집 · 갱신 확인 — 있다면 다음 단계 확인 / 검색 후보에 있나요? — 없다면 → 검색 조건 · 방식 확인 — 있다면 다음 단계 확인 / 최종 입력에 남았나요? — 없다면 → 선별 · 압축 과정 확인 — 있다면 다음 단계 확인 / 답이 근거를 따르나요? — 아니라면 → 생성 · 인용 검증 — 각 단계의 기록을 연결해 비교</desc><rect width="640" height="860" rx="24" fill="#faf7ef"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" fill="#183844"><text x="32" y="60" font-size="31" font-weight="700">오답은 어디에서 생겼을까?</text><rect x="32" y="96" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="134" font-size="29" font-weight="700">원문에 근거가 있나요?</text><text x="52" y="175" font-size="25" font-weight="400">없다면 → 자료 수집 · 갱신 확인</text><text x="52" y="212" font-size="24" font-weight="400">있다면 다음 단계 확인</text><path d="M320 247 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="274" width="576" height="145" rx="16" fill="#eef0f1" stroke="#a9bdb6"/><text x="52" y="312" font-size="29" font-weight="700">검색 후보에 있나요?</text><text x="52" y="353" font-size="25" font-weight="400">없다면 → 검색 조건 · 방식 확인</text><text x="52" y="390" font-size="24" font-weight="400">있다면 다음 단계 확인</text><path d="M320 425 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="452" width="576" height="145" rx="16" fill="#fff0d2" stroke="#a9bdb6"/><text x="52" y="490" font-size="29" font-weight="700">최종 입력에 남았나요?</text><text x="52" y="531" font-size="25" font-weight="400">없다면 → 선별 · 압축 과정 확인</text><text x="52" y="568" font-size="24" font-weight="400">있다면 다음 단계 확인</text><path d="M320 603 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="630" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="668" font-size="29" font-weight="700">답이 근거를 따르나요?</text><text x="52" y="709" font-size="25" font-weight="400">아니라면 → 생성 · 인용 검증</text><text x="52" y="746" font-size="24" font-weight="400">각 단계의 기록을 연결해 비교</text><text x="32" y="835" font-size="21" fill="#52666c">개념도 · 성능 측정값이나 고정 권장 구성이 아닙니다</text></g></svg>