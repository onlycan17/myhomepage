<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">근거가 답변이 되기까지</title><desc id="desc">미리 준비 — 문서 수집 · 의미 단위로 나누기 — 날짜 · 버전 · 권한을 색인에 기록 / 질문을 받으면 검색 — 허용된 자료에서 후보 찾기 — 키워드 · 의미 검색 등 활용 / 근거 선별 — 관련 순서 조정 · 중복 줄이기 — 예외 조건과 출처는 보존 / 답변과 인용 — 질문 + 근거를 모델에 전달 — 근거가 없으면 한계를 알리기</desc><rect width="640" height="860" rx="24" fill="#faf7ef"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" fill="#183844"><text x="32" y="60" font-size="31" font-weight="700">근거가 답변이 되기까지</text><rect x="32" y="96" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="134" font-size="29" font-weight="700">미리 준비</text><text x="52" y="175" font-size="25" font-weight="400">문서 수집 · 의미 단위로 나누기</text><text x="52" y="212" font-size="24" font-weight="400">날짜 · 버전 · 권한을 색인에 기록</text><path d="M320 247 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="274" width="576" height="145" rx="16" fill="#eef0f1" stroke="#a9bdb6"/><text x="52" y="312" font-size="29" font-weight="700">질문을 받으면 검색</text><text x="52" y="353" font-size="25" font-weight="400">허용된 자료에서 후보 찾기</text><text x="52" y="390" font-size="24" font-weight="400">키워드 · 의미 검색 등 활용</text><path d="M320 425 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="452" width="576" height="145" rx="16" fill="#fff0d2" stroke="#a9bdb6"/><text x="52" y="490" font-size="29" font-weight="700">근거 선별</text><text x="52" y="531" font-size="25" font-weight="400">관련 순서 조정 · 중복 줄이기</text><text x="52" y="568" font-size="24" font-weight="400">예외 조건과 출처는 보존</text><path d="M320 603 v17 m-6 -6 6 6 6 -6" fill="none" stroke="#287b72" stroke-width="3"/><rect x="32" y="630" width="576" height="145" rx="16" fill="#e3f2ec" stroke="#a9bdb6"/><text x="52" y="668" font-size="29" font-weight="700">답변과 인용</text><text x="52" y="709" font-size="25" font-weight="400">질문 + 근거를 모델에 전달</text><text x="52" y="746" font-size="24" font-weight="400">근거가 없으면 한계를 알리기</text><text x="32" y="835" font-size="21" fill="#52666c">개념도 · 성능 측정값이나 고정 권장 구성이 아닙니다</text></g></svg>